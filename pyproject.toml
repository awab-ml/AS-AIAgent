[project]
name = "as-aiagent"
version = "0.2.0"
description = "System-level defense architecture for AI agents — detect and block indirect prompt injection at runtime."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = ["ai", "agent", "security", "prompt-injection", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
cli = ["rich>=13.0"]
all = [
    "openai>=1.0",
    "anthropic>=0.20",
    "rich>=13.0",
]
dev = [
    "pytest>=8.0",
    "openai>=1.0",
    "anthropic>=0.20",
    "rich>=13.0",
]

[project.scripts]
as-aiagent = "secure_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["secure_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
